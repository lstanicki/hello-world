<section id="start" class="hero">
  <div class="container hero__inner">
    <p class="eyebrow">Angular 22</p>
    <h1>Hello, World!</h1>
    <p class="lead">Prosty layout mobile first w odcieniach niebieskiego.</p>

    <div class="counter">
      <span class="counter__value">{{ clicks() }}</span>
      <span class="counter__label">kliknięć</span>

      <div class="counter__actions">
        <button class="btn btn--primary" type="button" (click)="increment()">Kliknij</button>
        <button class="btn btn--ghost" type="button" [disabled]="clicks() === 0" (click)="reset()">
          Reset
        </button>
      </div>
    </div>
  </div>
</section>
