<header class="topbar">

      <span class="logo__mark">◆</span> Hello
    </a>

    <button
      class="menu-btn"
      type="button"
      aria-label="Menu"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="main-nav" class="nav" [class.nav--open]="menuOpen()">
      <a href="#start" (click)="closeMenu()">Start</a>
      <a href="#features" (click)="closeMenu()">Funkcje</a>
      <a href="#contact" (click)="closeMenu()">Kontakt</a>
    </nav>
  </div>
</header>
